    * { margin: 0; padding: 0; box-sizing: border-box; }

    #nearby-panel {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
      background: #fff; border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
      max-height: 200px; overflow-y: auto; padding: 15px 20px 25px;
      transition: max-height 0.3s;

    #nearby-panel .handle { width: 40px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 10px; }
    .nearby-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid #f0f0f0; cursor: pointer;
    }
    .nearby-item:last-child { border-bottom: none; }
    .nearby-item .num { width: 28px; height: 28px; border-radius: 50%; background: #2563eb; color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .nearby-item .info { flex: 1; }
    .nearby-item .info .name { font-weight: 600; font-size: 15px; }
    .nearby-item .info .dist { font-size: 12px; color: #888; }
    .nearby-item .info .type-badge { font-size: 11px; display: inline-block; padding: 1px 6px; border-radius: 4px; margin-top: 2px; color: #fff; }
    .nearby-item .nav-btn { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; font-weight: 500; white-space: nowrap; }
    #loading {
      position: absolute; top: 162px; left: 0; right: 0; bottom: 0; z-index: 2000;
      background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 18px; color: #333; gap: 10px;
    }
    #loading .spinner { width: 40px; height: 40px; border: 4px solid #e0e0e0; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .user-location { background: #059669; border-radius: 50%; width: 20px; height: 20px; border: 3px solid #fff; display: flex; align-items: center; justify-content: center; }
    .user-location::after { content: ''; position: absolute; width: 44px; height: 44px; border-radius: 50%; border: 3px solid rgba(5,150,105,0.4); animation: pulse-ring 2s infinite; pointer-events: none; }
    @keyframes pulse-ring { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
    .leaflet-popup-content-wrapper { border-radius: 12px !important; font-family: 'Noto Sans TC', sans-serif; }
    .leaflet-popup-content { font-size: 14px; margin: 10px 14px; }
    .leaflet-popup-content .popup-name { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
    .leaflet-popup-content .popup-type { font-size: 11px; display: inline-block; padding: 1px 8px; border-radius: 4px; color: #fff; margin-bottom: 4px; }
    .leaflet-popup-content .popup-addr { color: #666; font-size: 13px; }
    .leaflet-popup-content .popup-nav { display: inline-block; margin-top: 8px; background: #2563eb; color: #fff; padding: 6px 16px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 500; }
    .filter-btn { flex-shrink: 0; padding: 5px 12px; border-radius: 16px; border: 1px solid #ddd; background: #fff; font-size: 12px; cursor: pointer; white-space: nowrap; transition: 0.15s; }
    .filter-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    ::-webkit-scrollbar { display: none; }

  <div id="loading"><div class="spinner"></div><span data-i18n="loading_data">正在載入資料...</span></div>

  <div id="map"></div>

  <div id="nearby-panel"><div class="handle"></div><div id="nearby-list"></div></div>

  <script>
    var map, userMarker, hospData = [], filteredData = [], mcg, searchInstance = null;
    var loading = document.getElementById('loading');
    var nearbyPanel = document.getElementById('nearby-list');
    var filterBar = document.getElementById('filter-bar');
    var currentFilter = 'all';

    var typeIcons = { '醫院': { emoji: '🏥', bg: '#dc2626' }, '專科門診': { emoji: '🩺', bg: '#d97706' }, '診所': { emoji: '💊', bg: '#059669' } };

    function initMap(lat, lng) {
      map = L.map('map', { zoomControl: false }).setView([lat, lng], 16);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19, attribution: '&copy; OSM | CARTO'
      }).addTo(map);

      var userIcon = L.divIcon({ html: '<div class="user-location"></div>', className: '', iconSize: [20, 20], iconAnchor: [10, 10] });
      userMarker = L.marker([lat, lng], { icon: userIcon, zIndexOffset: 1000 }).addTo(map).bindPopup(LANG.t('your_location'));

      fetch('../data/hospitals.json').then(function(r) { return r.json(); }).then(function(data) {
        hospData = data;
        filteredData = data;
        buildFilterBar();
        renderMarkers();
        showNearest(lat, lng, data);
        loading.style.display = 'none';
        searchInstance = createSearch({
          container: '#search-container',
          data: hospData,
          fields: ['n', 'a', 'd', 't'],
          onFilter: function(fd) {
            filteredData = currentFilter === 'all' ? fd : fd.filter(function(h) { return h.t === currentFilter; });
            renderMarkers();
            if (userMarker) showNearest(userMarker.getLatLng().lat, userMarker.getLatLng().lng, filteredData);
          }
        });
      });
    }

    function buildFilterBar() {
      var counts = {};
      hospData.forEach(function(h) { counts[h.t] = (counts[h.t] || 0) + 1; });
      var cats = ['醫院', '專科門診', '診所'];
      var html = '<button class="filter-btn active" data-type="all">全部 (' + hospData.length + ')</button>';
      cats.forEach(function(k) {
        var c = counts[k] || 0;
        if (c > 0) html += '<button class="filter-btn" data-type="' + k + '">' + (typeIcons[k].emoji || '') + ' ' + k + ' (' + c + ')</button>';
      });
      filterBar.innerHTML = html;
      filterBar.querySelectorAll('.filter-btn').forEach(function(btn) {
        btn.onclick = function() {
          filterBar.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          currentFilter = btn.dataset.type;
          if (searchInstance) { searchInstance.filter(); } else { renderMarkers(); }
        };
      });
    }

    function renderMarkers() {
      if (mcg) { map.removeLayer(mcg); }

      mcg = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 50,
        iconCreateFunction: function(cluster) {
          return L.divIcon({ html: '<div style="background:#2563eb;color:#fff;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;border:2px solid #fff;">' + cluster.getChildCount() + '</div>', className: '', iconSize: [40, 40] });
        }
      });

      filteredData.forEach(function(h) {
        if (h.lat && h.lng) {
          var t = h.t || '診所';
          var iconInfo = typeIcons[t] || { emoji: '💊', bg: '#059669' };
          var icon = L.divIcon({ html: '<div style="background:' + iconInfo.bg + ';border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:16px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3);">' + iconInfo.emoji + '</div>', className: '', iconSize: [36, 36], iconAnchor: [18, 18], popupAnchor: [0, -18] });
          var marker = L.marker([h.lat, h.lng], { icon: icon });
          marker.bindPopup('<div class="popup-name">' + (h.n || '') + '</div><div class="popup-type" style="background:' + iconInfo.bg + '">' + iconInfo.emoji + ' ' + t + '</div><div class="popup-addr">' + (h.a || '') + '</div><a class="popup-nav" href="https://www.google.com/maps/dir/?api=1&destination=' + h.lat + ',' + h.lng + '" target="_blank">' + LANG.t('google_nav') + '</a>');
          mcg.addLayer(marker);
        }
      });
      map.addLayer(mcg);
    }

    function haversine(lat1, lng1, lat2, lng2) {
      var R = 6371000;
      var dLat = (lat2 - lat1) * Math.PI / 180;
      var dLng = (lng2 - lng1) * Math.PI / 180;
      var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng/2) * Math.sin(dLng/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function showNearest(lat, lng, data) {
      var list = data.map(function(h) { return { item: h, dist: haversine(lat, lng, h.lat, h.lng) }; }).sort(function(a, b) { return a.dist - b.dist; });
      var html = '<div style="font-weight:700;font-size:14px;margin-bottom:5px;">' + LANG.t('hospital_nearby') + '</div>';
      list.slice(0, 5).forEach(function(d, i) {
        var t = d.item.t || '診所';
        var iconInfo = typeIcons[t] || { emoji: '💊', bg: '#059669' };
        var meters = Math.round(d.dist);
        var walkMin = Math.round(d.dist / 80);
        html += '<div class="nearby-item" onclick="window.open(\'https://www.google.com/maps/dir/?api=1&destination=' + d.item.lat + ',' + d.item.lng + '\', \'_blank\')">';
        html += '<div class="num">' + (i+1) + '</div>';
        html += '<div class="info"><div class="name">' + (d.item.n || '') + '</div><div class="dist">' + meters + 'm（步行約 ' + walkMin + ' 分鐘） <span class="type-badge" style="background:' + iconInfo.bg + '">' + iconInfo.emoji + ' ' + t + '</span></div></div>';
        html += '<button class="nav-btn" onclick="event.stopPropagation();window.open(\'https://www.google.com/maps/dir/?api=1&destination=' + d.item.lat + ',' + d.item.lng + '\', \'_blank\')">' + LANG.t('navigate') + '</button>';
        html += '</div>';
      });
      nearbyPanel.innerHTML = html;
    }

    var watchId = null;
    if (navigator.geolocation) {
      watchId = navigator.geolocation.watchPosition(
        function(pos) {
          var lat = pos.coords.latitude, lng = pos.coords.longitude;
          if (!map) { initMap(lat, lng); } else {
            if (userMarker) { userMarker.setLatLng([lat, lng]); }
            if (hospData.length) { showNearest(lat, lng, filteredData.length ? filteredData : hospData); }
          }
        },
        function() { if (!map) { fallbackLocation(); } },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
      );
    } else { fallbackLocation(); }

    function fallbackLocation() {
      loading.innerHTML = '<div class="spinner"></div><span>' + LANG.t('loading_ip') + '</span>';
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'https://ipapi.co/json/', true);
      xhr.timeout = 5000;
      xhr.onload = function() {
        if (xhr.status === 200) {
          var ip = JSON.parse(xhr.responseText);
          if (ip.latitude && ip.longitude && ip.city) {
            initMap(ip.latitude, ip.longitude);
            return;
          }
        }
        showDistrictPicker();
      };
      xhr.onerror = showDistrictPicker;
      xhr.ontimeout = showDistrictPicker;
      xhr.send();
    }

    function showDistrictPicker() {
      loading.innerHTML = '<div style="text-align:center;padding:20px;"><div style="font-size:48px;margin-bottom:10px;">📍</div><div style="font-size:16px;margin-bottom:15px;">' + LANG.t('location_fail') + '<br>' + LANG.t('location_select') + '</div><div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">' +
        ['尖沙咀',22.3193,114.1694,'中環',22.2820,114.1580,'旺角',22.3196,114.1702,'銅鑼灣',22.2800,114.1830,'灣仔',22.2760,114.1730,'佐敦',22.3040,114.1710,'深水埗',22.3320,114.1620,'沙田',22.3810,114.1880].reduce(function(a,_,i,arr) {
          if (i%3===0) a.push('<button onclick="initMap('+arr[i+1]+','+arr[i+2]+')" style="padding:10px 18px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:14px;cursor:pointer;">'+arr[i]+'</button>'); return a;
        }, []).join('') + '</div></div>';
    }

    document.getElementById('locateBtn').onclick = function() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(pos) {
          map.setView([pos.coords.latitude, pos.coords.longitude], 16);
          if (userMarker) { userMarker.setLatLng([pos.coords.latitude, pos.coords.longitude]); }
          var data = filteredData.length ? filteredData : hospData;
          if (data.length) { showNearest(pos.coords.latitude, pos.coords.longitude, data); }
        });
      }
    };
  </script>
